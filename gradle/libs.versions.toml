[versions]
# Toolchain
# AGP 9.x bundles Kotlin support but breaks KSP and binary-compat with
# the kotlin-android plugin — so we ride the latest 8.x for now.
agp = "8.13.2"
kotlin = "2.3.21"
ksp = "2.3.9"

# AndroidX (latest versions compatible with AGP 8.13.2; newer ones need AGP 9.x)
coreKtx = "1.16.0"
activityCompose = "1.10.1"
lifecycle = "2.9.4"
navigationCompose = "2.8.9"
datastorePreferences = "1.1.7"

# Compose (BOM pins ui / material3 / runtime — do not pin individually)
composeBom = "2025.06.01"

# Persistence
room = "2.7.2"

# DI (kept on 3.x — Koin 4.x is an API-breaking swap, scheduled for Phase 2)
koin = "3.5.6"

# Async
coroutines = "1.11.0"

# Serialization (kept — Gson -> kotlinx.serialization is a Phase 2 swap)
gson = "2.10.1"

# Image / Drawing (Coil kept on 2.x — Coil 3 is a Phase 4 swap)
coil = "2.7.0"
compressor = "3.0.1"
drawbox = "1.0.3"
snapper = "0.3.0"
rangVikalp = "1.0.0-alpha02"

# Compose Material Navigation (replacement for accompanist-navigation-material)
composeMaterialNavigation = "1.11.3"

# Accompanist (permissions is the only remaining piece)
accompanist = "0.37.3"

# Tests
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"

[libraries]
# Core
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }

# Compose
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-runtime-livedata = { module = "androidx.compose.runtime:runtime-livedata" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

# Lifecycle
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }

# Navigation
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# Datastore
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferences" }

# Room
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# Koin
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }

# Coroutines
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# Image / Drawing
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
compressor = { module = "id.zelory:compressor", version.ref = "compressor" }
drawbox = { module = "io.ak1:drawbox", version.ref = "drawbox" }
snapper = { module = "dev.chrisbanes.snapper:snapper", version.ref = "snapper" }
rang-vikalp = { module = "io.ak1:rang-vikalp", version.ref = "rangVikalp" }

# Serialization
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# Compose Material Navigation (modal bottom sheets in nav graph — replaces accompanist-navigation-material)
androidx-compose-material-navigation = { module = "androidx.compose.material:material-navigation", version.ref = "composeMaterialNavigation" }

# Accompanist
accompanist-permissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanist" }

# Tests
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[bundles]
compose = [
    "androidx-compose-ui",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-material3",
    "androidx-compose-runtime-livedata",
    "androidx-activity-compose",
]
lifecycle = [
    "androidx-lifecycle-runtime-ktx",
    "androidx-lifecycle-viewmodel-ktx",
    "androidx-lifecycle-livedata-ktx",
]
room = [
    "androidx-room-runtime",
    "androidx-room-ktx",
]
accompanist = [
    "accompanist-permissions",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
